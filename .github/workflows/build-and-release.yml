name: 🚀 Build and Release - All Platforms

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release (yes/no)'
        required: false
        default: 'no'

jobs:
  # First job: Format check and analyze
  analyze:
    name: 📋 Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed .

  # Build Android APK
  build-android:
    name: 🤖 Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Build Android App Bundle
  build-android-bundle:
    name: 🤖 Build Android Bundle
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build App Bundle
        run: flutter build appbundle --release

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Build Windows
  build-windows:
    name: 🪟 Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Windows
        run: flutter build windows --release

      - name: 📦 Create ZIP
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../wadhakir-windows.zip

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: wadhakir-windows.zip
          retention-days: 30

  # Build Web
  build-web:
    name: 🌐 Build Web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Web
        run: flutter build web --release --web-renderer canvaskit

      - name: 📦 Create Web Archive
        run: |
          cd build/web
          tar -czf ../../wadhakir-web.tar.gz *

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: wadhakir-web.tar.gz
          retention-days: 30

  # Build iOS (requires macOS runner)
  build-ios:
    name: 🍎 Build iOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: 📦 Create iOS Archive
        run: |
          cd build/ios/iphoneos
          zip -r ../../../wadhakir-ios.zip Runner.app

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: wadhakir-ios.zip
          retention-days: 30

  # Create Release (only on tags or manual trigger with release option)
  create-release:
    name: 🎉 Create Release
    needs: [build-android, build-android-bundle, build-windows, build-web, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'yes'
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: 📥 Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/

      - name: 📥 Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/

      - name: 📥 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: artifacts/

      - name: 📥 Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/

      - name: 🏷️ Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 📝 Extract Changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          echo "Extracting changelog for version $VERSION_NUM"
          
          # Extract changelog section for this version
          if [ -f "CHANGELOG.md" ]; then
            awk "/## \[$VERSION_NUM\]/,/## \[/" CHANGELOG.md | sed '1d;$d' > release_notes.md
            
            # If no specific version found, use latest section
            if [ ! -s release_notes.md ]; then
              awk '/## \[/,/## \[/' CHANGELOG.md | sed '1d;$d' > release_notes.md
            fi
          else
            echo "Release $VERSION" > release_notes.md
          fi

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Wadhakir ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/wadhakir-windows.zip
            artifacts/wadhakir-web.tar.gz
            artifacts/wadhakir-ios.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy Web to GitHub Pages (optional)
  deploy-web:
    name: 🚀 Deploy Web to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 📥 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: 📦 Extract Web Build
        run: |
          mkdir -p web
          tar -xzf wadhakir-web.tar.gz -C web

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          # cname: wadhakir.yourdomain.com # Optional: Add your custom domain
