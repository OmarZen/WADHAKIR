name: Android Build & Release

# Two triggers:
#   1. Pushing a tag like v3.1.0+16 (or v3.1.0) → builds signed APK + AAB
#      and creates a GitHub release with the artifacts attached.
#   2. Manual `workflow_dispatch` → unsigned debug build for sanity checks.
#
# Android-only. Windows / iOS / Web were dropped — this app ships to
# Google Play, the other targets weren't being released anyway.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.6'
  JAVA_VERSION: '17'

jobs:
  # --------------------------------------------------------------- analyze
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter analyze

  # ----------------------------------------------------------- build
  # One job builds both APK (sideload + GitHub release attachment) and AAB
  # (Google Play upload) in the same checkout, sharing the keystore setup.
  build:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter config --no-analytics
      - run: flutter pub get

      # quran_library 4.2.0 (latest on pub.dev) ships an android/build.gradle
      # that calls `getDefaultProguardFile('proguard-android.txt')` — a file
      # AGP 9.x removed. Patch the pub-cache copy in-place so Gradle can
      # evaluate the script. Drop this step once the package ships a fix.
      - name: Patch quran_library for AGP 9.x
        run: |
          PKG="$PUB_CACHE/hosted/pub.dev/quran_library-4.2.0/android/build.gradle"
          if [ -f "$PKG" ]; then
            sed -i "s/'proguard-android\.txt'/'proguard-android-optimize.txt'/g" "$PKG"
            echo "Patched $PKG"
          fi

      # Tagged builds are signed release builds. Manual `workflow_dispatch`
      # runs produce a debug build that nobody ships, so the keystore step
      # is skipped on that path.
      - name: Set up keystore (release builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug --split-per-abi
          fi

      - name: Build App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # -------------------------------------------------------------- release
  # Tag-triggered only. Creates a GitHub release and attaches the signed
  # APK splits + the AAB. Release notes come from CHANGELOG.md (the
  # section matching the tag version) or fall back to the latest entry.
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Grab the block starting at `## [VERSION]` up to (not including)
          # the next `## [` header.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v$VERSION" > release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Wadhakir ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            artifacts/*.apk
            artifacts/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
