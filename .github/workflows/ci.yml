name: 🔍 CI - Code Quality & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-build:
    name: 🎨 Format & Build Flutter App
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🧹 Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
        
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must satisfy pubspec.yaml's `sdk: '>=3.12.0'` / `flutter: '>=3.44.0'`
          # (forui 0.23 needs Dart 3.12). 3.44.4 ships Dart 3.12.2. Keep this in
          # step with pubspec.yaml or `pub get` fails version solving.
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
          
      - name: 🚫 Disable Flutter Analytics
        run: flutter config --no-analytics
          
      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Verify Flutter Installation
        run: flutter doctor -v

      - name: 🎨 Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      # `build-and-release.yml` already has an `analyze` job that runs both of
      # these — but its `on:` block is `push` + `workflow_dispatch` only, and
      # this is the ONLY workflow triggered by `pull_request`. So until now the
      # analyzer and the test suite ran at exactly one moment in the lifecycle:
      # after a release tag had already been pushed. README.md and package.json
      # both tell contributors these gate a PR; now they actually do.
      - name: 🔬 Analyze
        run: flutter analyze

      - name: 🧪 Test
        run: flutter test

      # quran_library 4.2.x ships an android/build.gradle calling
      # getDefaultProguardFile('proguard-android.txt'). AGP 9.x hard-errors on it
      # at :quran_library CONFIGURATION time, so it kills debug builds too — not
      # just minified release ones. Still unfixed as of 4.2.1.
      # Must run AFTER `flutter pub get`, which restores the pristine pub-cache
      # copy. Delete this step (and the script) once upstream ships a fix.
      - name: 🩹 Patch quran_library for AGP 9.x
        run: bash android/fix_deps_proguard.sh

      - name: 🏗️ Build APK (Debug)
        run: flutter build apk --debug

      # The early-warning half of the size gate. `build-and-release.yml` holds
      # the authoritative one on the arm64 *release* APK, but that only runs on
      # a tag — by which point a 50 MB asset is already on develop. This is the
      # same script against the universal debug APK, which is the artifact this
      # workflow already builds, so a PR that adds a large asset goes red here
      # first.
      #
      # The budget is loose on purpose: a debug APK carries both ABIs and no
      # shrinking, so it moves for reasons a release APK does not. R3's asset
      # diet took it from 407.4 MB to 354.9 MB; 380 MB catches a gross
      # regression without failing on ordinary drift.
      - name: 📏 Check APK Size
        run: |
          bash tool/check_app_size.sh 380 "universal debug APK" \
            build/app/outputs/flutter-apk/app-debug.apk

      - name: ✅ Success Notification
        if: success()
        run: echo "🎉 All checks passed! Ready for review."