name: 🔍 CI - Code Quality & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-and-build:
    name: 🎨 Format & Build Flutter App
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🧹 Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
        
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true
          
      - name: 🚫 Disable Flutter Analytics
        run: flutter config --no-analytics
          
      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Verify Flutter Installation
        run: flutter doctor -v

      - name: 🎨 Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      # quran_library 4.2.0 (latest on pub.dev) ships an android/build.gradle
      # that calls `getDefaultProguardFile('proguard-android.txt')`. AGP 9.x
      # removed that file (it forced `-dontoptimize`) and now throws at
      # script-evaluation time. Until the package ships a fix, swap the
      # reference to `proguard-android-optimize.txt` in the pub-cache copy
      # before Gradle reads it. No-op if the file ever stops existing.
      - name: 🩹 Patch quran_library for AGP 9.x
        run: |
          PKG="$PUB_CACHE/hosted/pub.dev/quran_library-4.2.0/android/build.gradle"
          if [ -f "$PKG" ]; then
            sed -i "s/'proguard-android\.txt'/'proguard-android-optimize.txt'/g" "$PKG"
            echo "Patched $PKG"
            grep -n "proguard" "$PKG" || true
          else
            echo "Skipping patch — $PKG not found"
          fi

      - name: 🏗️ Build APK (Debug)
        run: flutter build apk --debug
        
      - name: ✅ Success Notification
        if: success()
        run: echo "🎉 All checks passed! Ready for review."