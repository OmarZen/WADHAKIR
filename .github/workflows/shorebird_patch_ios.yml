name: Shorebird iOS Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Target release version (leave empty for latest)'
        required: false
        type: string
      export_method:
        description: 'Export method (must match the release)'
        required: true
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise
        default: app-store
      patch_description:
        description: 'Patch description (what changed)'
        required: true
        type: string

jobs:
  patch:
    name: Deploy iOS Patch
    runs-on: macos-latest
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
      
      - name: 🔐 Shorebird Login
        run: |
          shorebird login:ci --token ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: 🔍 Pre-Patch Analysis
        run: |
          echo "## 🔍 Running Pre-Patch Analysis..." >> $GITHUB_STEP_SUMMARY
          flutter analyze --no-fatal-infos || true
      
      - name: 🚀 Deploy iOS Patch
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            shorebird patch ios \
              --release-version="${{ inputs.release_version }}" \
              --export-method=${{ inputs.export_method }}
          else
            shorebird patch ios \
              --export-method=${{ inputs.export_method }}
          fi
      
      - name: ✅ Patch Summary
        run: |
          echo "## 🎉 iOS Patch Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Description:** ${{ inputs.patch_description }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "**Target Version:** ${{ inputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Target Version:** latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Export Method:** ${{ inputs.export_method }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 What Happens Next:" >> $GITHUB_STEP_SUMMARY
          echo "- Users will receive the patch on next app restart" >> $GITHUB_STEP_SUMMARY
          echo "- The update downloads automatically in the background" >> $GITHUB_STEP_SUMMARY
          echo "- Changes are applied after the app is restarted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ iOS Performance Note:" >> $GITHUB_STEP_SUMMARY
          echo "Changed code runs in a Dart interpreter (slightly slower)." >> $GITHUB_STEP_SUMMARY
          echo "This is usually unnoticeable unless changing performance-critical code." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Monitor Patch in Shorebird Console](https://console.shorebird.dev)" >> $GITHUB_STEP_SUMMARY
      
      - name: 📝 Create Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const releaseVersion = '${{ inputs.release_version }}' || 'latest';
            const description = '${{ inputs.patch_description }}';
            const exportMethod = '${{ inputs.export_method }}';
            const timestamp = new Date().toISOString();
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🔁 iOS Patch Deployed\n\n**Version:** ${releaseVersion}\n**Export Method:** ${exportMethod}\n**Description:** ${description}\n**Deployed:** ${timestamp}\n\n[View in Shorebird Console](https://console.shorebird.dev)`
            });
