name: Shorebird iOS Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.0.0+1)'
        required: true
        type: string
      export_method:
        description: 'Export method'
        required: true
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise
        default: app-store

jobs:
  release:
    name: Create iOS Release
    runs-on: macos-latest
    
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
      
      - name: 🔐 Shorebird Login
        run: |
          shorebird login:ci --token ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: 🔑 Setup iOS Certificates
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificates (if provided)
          # Add your certificate import logic here if needed
      
      - name: 📦 Build iOS Release
        run: |
          shorebird release ios \
            --export-method=${{ inputs.export_method }}
      
      - name: 📤 Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ inputs.release_version }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
      
      - name: ✅ Release Summary
        run: |
          echo "## 🎉 iOS Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Export Method:** ${{ inputs.export_method }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📤 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the .ipa artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload to App Store Connect" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy patches using the Shorebird Patch workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View in Shorebird Console](https://console.shorebird.dev)" >> $GITHUB_STEP_SUMMARY
      
      - name: 🧹 Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
