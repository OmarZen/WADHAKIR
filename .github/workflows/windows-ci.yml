name: Windows Desktop CI

on:
  push:
    branches: [ feature/windows-desktop-support ]
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/windows-ci.yml'

jobs:
  build-windows:
    name: Build and Test Windows Desktop
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      
      - name: 📦 Get Dependencies
        run: flutter pub get
      
      - name: 🔍 Verify Flutter
        run: flutter doctor -v
      
      - name: 📊 Analyze Code
        run: flutter analyze
      
      - name: 🧪 Run Tests
        run: flutter test
      
      - name: 🏗️ Build Windows Debug
        run: flutter build windows --debug
      
      - name: 📦 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-build
          path: build/windows/x64/runner/Debug/
          retention-days: 7
      
      - name: 📊 Build Summary
        run: |
          echo "## 🪟 Windows Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Artifacts uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Platform: Windows x64" >> $GITHUB_STEP_SUMMARY

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-desktop-support'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      
      - name: 📦 Get Dependencies
        run: flutter pub get
      
      - name: 🏗️ Build Windows Release
        run: flutter build windows --release
      
      - name: 📦 Create Release Archive
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../wadhakir-windows-x64.zip
      
      - name: 📦 Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: wadhakir-windows-x64.zip
          retention-days: 30
