name: wadhakir
description: "Complete Islamic companion: Prayer times, Quran, Azkar, Radio & Qibla finder"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.3.2+22

environment:
  # Bumped for forui 0.22.x (requires Dart >=3.12 / Flutter >=3.44).
  # CI runners and all contributors must use Flutter >=3.44.0.
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # Unified component library (layered alongside Material). Requires
  # Dart >=3.12 / Flutter >=3.44 — see environment block below.
  forui: ^0.26.0

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  
  # Local storage
  shared_preferences: ^2.5.5

  # Sharing functionality
  share_plus: ^13.3.0
  
  # Qibla compass
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  vector_math: ^2.4.2
  adhan_dart: ^2.0.1
  syncfusion_flutter_datepicker: ^34.2.6
  syncfusion_flutter_core: ^34.2.6
  syncfusion_localizations: ^34.2.6
  intl: ^0.20.3
  
  # Quran Library (pub.dev package)
  quran_library: ^4.3.0
  
  # Notifications
  awesome_notifications: ^0.12.1
  windows_notification: ^1.3.0
  permission_handler: ^13.0.2
  rxdart: ^0.28.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Celebratory confetti for completion rewards (daily wird, full salah day,
  # azkar/tasbih completion, streak & khatma milestones). Imperative overlay
  # API (Confetti.launch) — no persistent controller needed.
  flutter_confetti: ^0.9.2

  # UI Components
  # just_audio + audio_session: radio playback and the adhan sound preview.
  # flutter_volume_controller: radio volume sync.
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_volume_controller: ^2.0.2
  # Live camera preview behind the AR Qibla overlay (Feature: Qibla AR mode).
  camera: ^0.12.1
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.2
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  # UN-PINNED (was exactly 0.9.3). History: 0.9.2 stopped applying the Kotlin
  # Gradle Plugin on AGP 9+ because it assumed built-in Kotlin was ON, while we
  # keep android.builtInKotlin=false as the escape hatch other plugins still
  # need. Under that combination 0.9.2's Kotlin never compiled
  # (Unresolved HomeWidgetProvider), so the version was pinned.
  #
  # 0.9.4 was verified against this exact config — AGP 9.1.0, Gradle 9.3.1,
  # Kotlin 2.3.21, compileSdk 37, android.builtInKotlin=false — with a full
  # `flutter build apk --debug`: succeeded, no Unresolved HomeWidgetProvider.
  # The caret is therefore safe to restore. android.builtInKotlin stays false;
  # flipping it is a separate migration that needs every KGP-applying plugin to
  # support built-in Kotlin first.
  home_widget: ^0.9.4
  path_provider: ^2.1.6
  hugeicons: ^1.1.7

  # Floating adhkar overlay (Android only). Renders a Flutter widget tree
  # over other apps via SYSTEM_ALERT_WINDOW. iOS doesn't allow this, so the
  # feature degrades gracefully to disabled there.
  flutter_overlay_window: ^0.5.0

  # Islamic-backgrounds / share-card customization
  flutter_colorpicker: ^1.1.0    # color wheel for custom background colors
  image_picker: ^1.2.3           # pick a background photo from the device
  gal: ^2.3.3                    # save the rendered image to the gallery
  # Set-as-wallpaper is done natively via WallpaperManager (a small
  # MethodChannel in MainActivity) — no third-party wallpaper plugin, which
  # keeps the manifest free of live-wallpaper services/foreground-service perms.

  # Reads the app version at runtime so the About screen shows whatever is in
  # `version:` above — one source of truth, instead of a hand-copied string that
  # silently goes stale on every release. Already forced to 10.x below.
  package_info_plus: ^10.2.1

  # Backup / restore (Feature: النسخ الاحتياطي).
  #
  # pointycastle — AES-256-GCM + PBKDF2-HMAC-SHA256 for the optional
  # password-protected export. Deliberately chosen over `cryptography` and
  # `encrypt`: it is PURE DART with no platform channel and no Android module,
  # so it adds zero Gradle surface to a build that already carries
  # android.builtInKotlin=false and a sed-patched quran_library. `crypto` was
  # already in the tree but only does hashing — it has no cipher.
  #
  # file_selector — the import file picker. Chosen over the more popular
  # `file_picker` because it is flutter/packages (first-party, same release
  # train as the SDK); both apply KGP on Android, so the build risk is
  # identical and first-party maintenance is the tiebreak. Export needs no
  # picker at all — it writes a temp file and hands it to share_plus, which
  # this app already uses in three other places.
  pointycastle: ^4.0.0
  file_selector: ^1.1.0

dependency_overrides:
  # share_plus 13.x needs win32 ^6.x but geolocator_linux pins win32 ^5.x.
  # Force win32 6.x; package_info_plus 9.x is incompatible with win32 6.x,
  # so we also force-bump it to 10.x. Android/Windows/iOS unaffected.
  win32: ^6.4.0
  package_info_plus: ^10.2.1
  package_info_plus_platform_interface: ^4.1.0
  # path_provider_foundation 2.5.0/2.6.0 ship an `objective_c` Dart-FFI native
  # code asset. Flutter 3.44's native-assets installer crashes parsing Xcode 26's
  # `otool` output (parseOtoolArchitectureSections → null check), failing the iOS
  # build. 2.5.1 is the newest release WITHOUT objective_c, so pinning it removes
  # the native-assets path entirely. Revert once Flutter's tooling supports the
  # newer otool format. iOS path_provider behaviour is unchanged.
  # DO NOT let `pub upgrade --major-versions` lift this pin. It did once, and
  # `flutter test` immediately crashed with the exact failure described above:
  #   _TypeError: parseOtoolArchitectureSections
  #   (native_assets_host.dart:332) → getInstallNamesDylib → installCodeAssets
  # 2.6.0 ships the objective_c Dart-FFI code asset; 2.5.1 does not, which is
  # what keeps the native-assets path out of the build entirely.
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # NOTE: build_runner / hive_generator / json_serializable were removed —
  # the project has no @HiveType/@JsonSerializable annotations or .g.dart
  # files (Hive adapters are hand-written in data/models/hive_adapters.dart),
  # so they were unused. Removing them also lifts the analyzer <7.0.0 cap
  # that was forcing forui down to an ancient 0.10.x.

  # CLI tools — invoked manually to generate icons / splash assets.
  flutter_launcher_icons: ^0.14.4

  # MSIX packaging for Windows
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/mosques/
    - assets/images/profile/
    - assets/lang/
    - assets/json_data/
    - assets/adhan_sounds/
    - assets/icons/icon.png
    - assets/icons/custom_menu.svg
    - assets/icons/custom_audio.svg
    - assets/logo.png
    - lib/features/radio/api_response.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf
          weight: 700
    - family: Jomhuria
      fonts:
        - asset: assets/fonts/Jomhuria/Jomhuria-Regular.ttf
          weight: 400
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/Aref_Ruqaa/ArefRuqaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Aref_Ruqaa/ArefRuqaa-Bold.ttf
          weight: 700

msix_config:
  display_name: Wadhakir
  publisher_display_name: Omar Waleed
  publisher: CN=DF776E6F-2B42-431A-B1DB-7378360B1BC1
  identity_name: OmarWaleed.Wadhakir
  msix_version: 3.3.2.0
  capabilities: "internetClient,location"
  
  # Store submission settings
  store: true
  architecture: x64
  
  # Languages
  languages: ar, en-us
  
  # App description
  description: >
    WADHAKIR is a complete Islamic companion app featuring prayer times, 
    Quran, Azkar, Islamic radio, and Qibla finder.
  
  # Logo configuration
  logo_path: assets/icons/icon.png
  icons_background_color: '#FFFFFF'
  
  # Certificate settings (not needed for Store, will be signed by MS)
  install_certificate: false